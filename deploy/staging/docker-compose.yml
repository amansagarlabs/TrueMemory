services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - truememory_staging_postgres:/var/lib/postgresql/data
      - ../../backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [memory]

  backend:
    image: ${TRUEMEMORY_IMAGE:?set TRUEMEMORY_IMAGE}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: staging
      USE_DOCKER_POSTGRES: "true"
      DATABASE_URL_DOCKER: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_COOKIE_SECURE: "true"
      CORS_ORIGINS: https://${STAGING_DOMAIN:?set STAGING_DOMAIN}
      KONTEXT_ENABLE_TEST_AUTH: "0"
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8000"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readiness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks: [memory]

  memory-ingestion-worker:
    image: ${TRUEMEMORY_IMAGE:?set TRUEMEMORY_IMAGE}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: staging
      USE_DOCKER_POSTGRES: "true"
      DATABASE_URL_DOCKER: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KONTEXT_ENABLE_TEST_AUTH: "0"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "worker.memory_ingestion_worker"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.config import get_settings; from services.memory_ingestion import ingestion_worker_is_healthy; assert ingestion_worker_is_healthy(get_settings())"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped
    networks: [memory]

  edge:
    image: caddy:2.10-alpine
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?set STAGING_DOMAIN}
    ports:
      - "${STAGING_HTTP_PORT:-80}:80"
      - "${STAGING_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - truememory_staging_caddy_data:/data
      - truememory_staging_caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks: [memory]

volumes:
  truememory_staging_postgres:
  truememory_staging_caddy_data:
  truememory_staging_caddy_config:

networks:
  memory:
