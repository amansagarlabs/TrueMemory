# Local development stack: backend + local Postgres. Vector DB stays on Zilliz / Milvus.
services:
  coding-runtime:
    image: truememory-coding-runtime:local
    build:
      context: ./backend/coding_runtime
      dockerfile: Dockerfile
    command: ["true"]
    network_mode: "none"
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./infra/searxng:/etc/searxng:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_workspace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on:
      - postgres
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  backend:
    image: truememory-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      coding-runtime:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      HF_HOME: /root/.cache/huggingface
      MEMORY_DB_PATH: /app/data/memory.db
      CODING_RUNTIME_ENABLED: ${CODING_RUNTIME_ENABLED:-true}
      CODING_RUNTIME_IMAGE: truememory-coding-runtime:local
      CODING_RUNTIME_ROOT: /app/coding-workspaces
      CODING_RUNTIME_VOLUME: truememory-coding-workspaces
    dns:
      - 8.8.8.8

      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/knowledge_base:/app/knowledge_base
      - ./backend/data:/app/data
      - coding_workspaces:/app/coding-workspaces
      - huggingface_cache:/root/.cache/huggingface
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readiness', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  coding-worker:
    # Reuse the backend image. Both services run the same Python environment;
    # avoiding a second concurrent export prevents BuildKit tag collisions.
    image: truememory-backend:local
    depends_on:
      postgres:
        condition: service_healthy
      coding-runtime:
        condition: service_completed_successfully
    command: ["python", "-m", "worker.coding_worker"]
    env_file:
      - .env
    environment:
      HF_HOME: /root/.cache/huggingface
      MEMORY_DB_PATH: /app/data/memory.db
      CODING_RUNTIME_ENABLED: ${CODING_RUNTIME_ENABLED:-true}
      CODING_RUNTIME_IMAGE: truememory-coding-runtime:local
      CODING_RUNTIME_ROOT: /app/coding-workspaces
      CODING_RUNTIME_VOLUME: truememory-coding-workspaces
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/knowledge_base:/app/knowledge_base
      - ./backend/data:/app/data
      - coding_workspaces:/app/coding-workspaces
      - huggingface_cache:/root/.cache/huggingface
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c", "from app.config import get_settings; from services.postgres_store import list_coding_worker_heartbeats; assert any(item.get('connected') for item in list_coding_worker_heartbeats(get_settings()))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  memory-ingestion-worker:
    # Universal intake worker. It reuses the backend image and PostgreSQL
    # queue semantics; it does not create a second memory store.
    image: truememory-backend:local
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "worker.memory_ingestion_worker"]
    env_file:
      - .env
    environment:
      HF_HOME: /root/.cache/huggingface
      MEMORY_DB_PATH: /app/data/memory.db
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  huggingface_cache:
  coding_workspaces:
    name: truememory-coding-workspaces
