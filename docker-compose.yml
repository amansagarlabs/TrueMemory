# TrueMemory application stack.
#
# Development/hosted runtime uses the DATABASE_URL supplied through
# backend/.env (currently Supabase PostgreSQL). This compose file deliberately
# does not start local PostgreSQL or pgAdmin. The disposable postgres-test
# service exists only in docker-compose.test.yml.
services:
  coding-runtime:
    image: truememory-coding-runtime:local
    build:
      context: ./backend/coding_runtime
      dockerfile: Dockerfile
    command: ["true"]
    network_mode: "none"
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./infra/searxng:/etc/searxng:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    image: truememory-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      coding-runtime:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      HF_HOME: /root/.cache/huggingface
      MEMORY_DB_PATH: /app/data/memory.db
      CODING_RUNTIME_ENABLED: ${CODING_RUNTIME_ENABLED:-true}
      CODING_RUNTIME_IMAGE: truememory-coding-runtime:local
      CODING_RUNTIME_ROOT: /app/coding-workspaces
      CODING_RUNTIME_VOLUME: truememory-coding-workspaces
    dns:
      - 8.8.8.8

      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/knowledge_base:/app/knowledge_base
      - ./backend/data:/app/data
      - coding_workspaces:/app/coding-workspaces
      - huggingface_cache:/root/.cache/huggingface
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readiness', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  coding-worker:
    # Reuse the backend image. Both services run the same Python environment;
    # avoiding a second concurrent export prevents BuildKit tag collisions.
    image: truememory-backend:local
    depends_on:
      coding-runtime:
        condition: service_completed_successfully
    command: ["python", "-m", "worker.coding_worker"]
    env_file:
      - ./backend/.env
    environment:
      HF_HOME: /root/.cache/huggingface
      MEMORY_DB_PATH: /app/data/memory.db
      CODING_RUNTIME_ENABLED: ${CODING_RUNTIME_ENABLED:-true}
      CODING_RUNTIME_IMAGE: truememory-coding-runtime:local
      CODING_RUNTIME_ROOT: /app/coding-workspaces
      CODING_RUNTIME_VOLUME: truememory-coding-workspaces
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/knowledge_base:/app/knowledge_base
      - ./backend/data:/app/data
      - coding_workspaces:/app/coding-workspaces
      - huggingface_cache:/root/.cache/huggingface
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c", "from app.config import get_settings; from services.postgres_store import list_coding_worker_heartbeats; assert any(item.get('connected') for item in list_coding_worker_heartbeats(get_settings()))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  memory-ingestion-worker:
    # Universal intake worker. It reuses the backend image and PostgreSQL
    # queue semantics; it does not create a second memory store.
    image: truememory-backend:local
    depends_on:
      backend:
        condition: service_started
    command: ["python", "-m", "worker.memory_ingestion_worker"]
    env_file:
      # Use the hosted Supabase database for the API container. The root .env
      # is still used for Compose interpolation and local-only services.
      - ./backend/.env
    environment:
      HF_HOME: /root/.cache/huggingface
      MEMORY_DB_PATH: /app/data/memory.db
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface_cache:
  coding_workspaces:
    name: truememory-coding-workspaces
